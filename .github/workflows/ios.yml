name: iOS build

on:
  push:
    branches: [main, "feature/ios-support"]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build iOS app
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: List schemes
        working-directory: ios
        run: xcodebuild -project PhotoSync.xcodeproj -list

      - name: Build for simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project PhotoSync.xcodeproj \
            -scheme PhotoSync \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log

      # Surface compiler errors as workflow annotations so they are visible
      # without downloading the full log.
      - name: Report errors
        if: failure()
        working-directory: ios
        run: |
          if [ -f build.log ]; then
            grep -E "error:|warning: .*never used" build.log | head -40 || true
            echo "---"
            grep -E "error:" build.log | head -40 | while IFS= read -r line; do
              echo "::error title=Swift build::$line"
            done
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ios/build.log
          retention-days: 7
          if-no-files-found: ignore

      - name: SwiftLint (advisory)
        continue-on-error: true
        run: |
          brew install swiftlint
          cd ios && swiftlint --reporter github-actions-logging || true
