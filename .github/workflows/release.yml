name: Release

# Trigger by pushing a tag like v1.2.0, or run manually to build artifacts
# without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      draft:
        description: "Only build artifacts, do not publish a release"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Desktop client: cross-compile every platform in one Linux job.
  # ---------------------------------------------------------------------------
  desktop:
    name: Desktop client
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: pc/go.sum

      - name: Resolve version
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Vet
        working-directory: pc
        run: go vet ./...

      - name: Build all platforms
        working-directory: pc
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Package (tar.gz / zip)
        working-directory: pc/dist
        run: |
          V="${{ steps.version.outputs.version }}"
          mkdir -p ../release
          for f in sync-client-*; do
            case "$f" in
              *windows*)
                # zip preserves the .exe bit and is what Windows users expect
                zip -q -9 "../release/${f%.exe}-v${V}.zip" "$f"
                ;;
              *)
                tar -czf "../release/${f}-v${V}.tar.gz" -C . "$f"
                ;;
            esac
          done
          ls -lh ../release

      - name: Checksums
        working-directory: pc
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: desktop
          path: pc/release/*
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Android APK. Signing keys come from repository secrets; without them we
  # still build an unsigned-by-release-key (debug-signed) APK so the workflow
  # never blocks a release on missing credentials.
  # ---------------------------------------------------------------------------
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Resolve version
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 未配置，release 将使用 debug 签名"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
          {
            echo "storeFile=keystore/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          chmod 600 keystore.properties keystore/release.jks
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build APK
        working-directory: android
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease \
            -PversionName="$VERSION" \
            --no-daemon --stacktrace

      - name: Verify signature and zipalign
        working-directory: android
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "::error::没有生成 APK"
            exit 1
          fi
          echo "APK=$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -c -v 4 "$APK" > /dev/null && echo "✓ zipalign ok"
          "$BT/apksigner" verify --print-certs "$APK" 2>/dev/null | grep -E "Signer #1" || true
          # A debug-signed "release" still installs, but cannot upgrade a
          # properly signed install; surface that rather than failing silently.
          if "$BT/apksigner" verify --print-certs "$APK" 2>/dev/null | grep -q "CN=Android Debug"; then
            echo "::warning::APK 使用 debug 签名（未配置 ANDROID_KEYSTORE_BASE64）"
          else
            echo "✓ 使用正式签名"
          fi

      - name: Stage artifact
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          mkdir -p out
          cp "$APK" "out/PhotoSync-android-v${VERSION}.apk"
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # iOS: build on macOS. Ad-hoc signed, no App Store credentials needed.
  # ---------------------------------------------------------------------------
  ios:
    name: iOS app
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Resolve version
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate project
        working-directory: ios
        run: xcodegen generate

      - name: Build for simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project PhotoSync.xcodeproj \
            -scheme PhotoSync \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            -derivedDataPath build \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log

      - name: Report errors
        if: failure()
        working-directory: ios
        run: |
          if [ -f build.log ]; then
            grep -E "error:" build.log | head -40 | while IFS= read -r line; do
              echo "::error title=Swift build::$line"
            done
          fi

      - name: Package simulator app
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p out
          APP=$(find ios/build/Build/Products/Release-iphonesimulator -name "PhotoSync.app" | head -1)
          if [ -n "$APP" ]; then
            ditto -c -k --keepParent "$APP" "out/PhotoSync-ios-simulator-v${VERSION}.zip"
            echo "✓ packaged $APP"
          else
            echo "::warning::未找到 PhotoSync.app"
          fi
          ls -lh out || true

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: out/*
          retention-days: 7
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Publish: one GitHub Release with everything attached.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish release
    needs: [desktop, android, ios]
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && !inputs.draft)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect files
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          cd release
          # Re-generate checksums over the final file set.
          sha256sum * > SHA256SUMS.txt
          ls -lh

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          if [ -f CHANGELOG.md ]; then
            # Take everything up to the second "## " heading = latest version block.
            awk '/^## /{n++} n==1' CHANGELOG.md > notes.md
          fi
          if [ ! -s notes.md ]; then
            echo "发布 ${{ github.ref_name }}" > notes.md
          fi
          cat notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: PhotoSync ${{ github.ref_name }}
          body_path: notes.md
          files: release/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
          fail_on_unmatched_files: false
